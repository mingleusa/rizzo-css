# Deploy the docs site to the Plesk server (rizzo-css.jordanmingle.dev), served by deploy/server.cjs
# as a Plesk Node.js app (Phusion Passenger). Runs after the "Accessibility (a11y)" workflow passes on
# a push to main, or manually from the Actions tab. See docs/DEPLOYMENT.md.
#
# Required repository secrets:
#   DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_KEY (private key), DEPLOY_PATH (Node app root)
#   PUBLIC_ALGOLIA_APP_ID, PUBLIC_ALGOLIA_SEARCH_KEY, PUBLIC_ALGOLIA_INDEX_NAME, PUBLIC_ALGOLIA_ENABLED
name: Deploy

on:
  workflow_run:
    workflows: ['Accessibility (a11y)']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://rizzo-css.jordanmingle.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          PUBLIC_ALGOLIA_APP_ID: ${{ secrets.PUBLIC_ALGOLIA_APP_ID }}
          PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.PUBLIC_ALGOLIA_SEARCH_KEY }}
          PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.PUBLIC_ALGOLIA_INDEX_NAME }}
          PUBLIC_ALGOLIA_ENABLED: ${{ secrets.PUBLIC_ALGOLIA_ENABLED }}

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload site and server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT"
          TARGET="$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH%/}"
          # New files land first, then old ones are removed, so pages never reference missing assets mid-deploy.
          rsync -az --delete-after --delay-updates -e "$SSH" dist/ "$TARGET/dist/"
          rsync -az -e "$SSH" deploy/server.cjs "$TARGET/server.cjs"
          # Passenger restarts the app when tmp/restart.txt is touched.
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '${DEPLOY_PATH%/}/tmp' && touch '${DEPLOY_PATH%/}/tmp/restart.txt'"

      - name: Smoke check
        run: |
          for path in / /docs/getting-started /blocks; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://rizzo-css.jordanmingle.dev$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done
