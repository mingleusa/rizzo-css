packages:
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  sharp: true
  unrs-resolver: false

# braces (GHSA-vfj7-8cjw-p6xm): no patched release; reachable only via dev tooling (stylelint, and the Jest chain of
# @storybook/test-runner). Remove once a fix ships (see docs/UPGRADE.md). CI runs `pnpm audit --audit-level=high`.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

overrides:
  rollup: ^4.59.0
  ajv: ^8.18.0
  devalue: '>=5.6.4'
  svgo: '>=4.0.1'
  flatted: '>=3.4.0'
  axios: '>=1.16.0'
  qs: '>=6.13.0'
  uuid: '>=11.1.1'
  # js-yaml@3 only uses argparse in its CLI bin; argparse@1 pulls in sprintf-js (GHSA-hp3w-g68c-fv3c, unpatched).
  'argparse@^1.0.7': ^2.0.1
